name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend audit
        run: |
          cd collegeLaBoussoleApp/backend
          npm install
          npm audit --audit-level=high

      - name: Frontend audit
        run: |
          cd collegeLaBoussoleApp/frontend
          npm install
          npm audit --audit-level=high
