name: Branch Name Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"

          if [[ ! "$BRANCH" =~ ^(feature|feat|fix|hotfix)/[0-9]+-[a-z0-9-]+$ && ! "$BRANCH" =~ ^(dev|main)$ ]]; then
            echo "❌ Nom de branche invalide."
            echo "Format attendu:"
            echo "feature/123-description"
            echo "feat/123-description"
            echo "fix/123-description"
            echo "hotfix/123-description"
            echo "ou dev/main pour les branches principales"
            exit 1
          fi

          echo "✅ Nom de branche valide."
