# commit-message.yml
name: Commit Message Check

on:
  pull_request:
    branches:
      - main
      - dev
      - feature/**
      - fix/**
      - hotfix/**
      - release/**

jobs:
  commit-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate commit messages
        run: |
          echo "🔎 Vérification des messages de commit..."
          echo ""

          REGEX="^(feat|feature|fix|docs|chore|refactor|test|hotfix)\([a-z0-9-]+\): Fixes #[0-9]+ - .+"

          INVALID=0

          # Récupérer les 50 derniers commits, ligne par ligne
          git log -n 50 --format=%s | while IFS= read -r commit; do

            # Ignorer merges et releases
            if [[ "$commit" =~ ^Merge\ pull\ request ]] || [[ "$commit" =~ ^chore\(release\) ]]; then
              echo "➡️ Commit ignoré: \"$commit\""
              continue
            fi

            echo "➡️ Analyse: \"$commit\""

            if ! [[ "$commit" =~ $REGEX ]]; then
              echo ""
              echo "❌ Commit invalide détecté:"
              echo "   \"$commit\""
              echo ""
              echo "📘 Format attendu :"
              echo "   type(scope): Fixes #<issue> - message"
              echo ""
              echo "📌 Types autorisés :"
              echo "   feat | feature | fix | docs | chore | refactor | test | hotfix"
              echo ""
              echo "✅ Exemple valide :"
              echo "   feat(login): Fixes #12 - Ajout page login"
              echo ""
              echo "💡 Exemple corrigé possible :"
              echo "   feat(module): Fixes #1 - Description claire du changement"
              echo ""
              INVALID=1
            else
              echo "   ✅ Commit valide"
              echo ""
            fi
          done

          if [ $INVALID -eq 1 ]; then
            echo "🚫 Push bloqué : certains commits ne respectent pas la convention."
            exit 1
          fi

          echo "🎉 Tous les commits respectent la convention."
