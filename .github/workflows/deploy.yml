name: Deploy to VPS

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Déploiement CollegeLaBoussole — staging
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy via vps-monitor
        run: |
          RESPONSE=$(curl -s -w "\nHTTP:%{http_code}" -X POST "${{ secrets.VPS_MONITOR_URL }}/api/webhook/deploy" \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"name": "CollegeLaBoussole"}')
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || { echo "Échec déploiement vps-monitor"; exit 1; }
