name: Deploy

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            REPO_DIR="/var/www/CollegeLaBoussole"
            COMPOSE_FILE="/var/www/docker-compose.yml"

            # Pull latest code
            if [ -d "$REPO_DIR/.git" ]; then
              git -C "$REPO_DIR" pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git "$REPO_DIR"
            fi

            # Check backend .env exists
            if [ ! -f "$REPO_DIR/collegeLaBoussoleApp/backend/.env" ]; then
              echo "ERROR: $REPO_DIR/collegeLaBoussoleApp/backend/.env is missing"
              exit 1
            fi

            # Build images
            docker compose -f "$COMPOSE_FILE" build clb-back clb-front

            # Start / restart containers
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans clb-back clb-front

            # Clean unused images
            docker image prune -f

            # Verify containers are running
            docker ps --filter "name=clb-" --format "table {{.Names}}\t{{.Status}}"
