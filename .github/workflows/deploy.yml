name: Deploy

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy via vps-monitor
        run: |
          curl -f -sS -X POST "${{ secrets.VPS_MONITOR_URL }}/api/webhook/deploy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.VPS_MONITOR_WEBHOOK_SECRET }}" \
            -d '{"name":"CollegeLaBoussole"}'
