name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          cd collegeLaBoussoleApp/backend && npm install
          cd ../frontend && npm install

      - name: ESLint
        run: |
          cd collegeLaBoussoleApp/backend && npx eslint . --ext .js,.ts
          cd ../frontend && npx eslint . --ext .js,.jsx

      - name: Prettier
        run: npx prettier --check .
