name: Release

on:
  pull_request:
    branches:
      - main
    types: [closed] # On ne lance le workflow que lorsque le PR est fermé/mergé

jobs:
  create-release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------
      # 1️⃣ Checkout repo complet
      # ---------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------
      # 2️⃣ Récupérer la version actuelle dans le changelog
      # ---------------------------------------
      - name: Extract latest version from CHANGELOG
        id: get_version
        run: |
          # On récupère la première version listée (pas Unreleased)
          VERSION_LINE=$(grep -m 1 "^## \[[0-9]\+\.[0-9]\+\.[0-9]\+\]" CHANGELOG.md)
          CURRENT_VERSION=$(echo "$VERSION_LINE" | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          echo "CURRENT_VERSION=$CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      # ---------------------------------------
      # 3️⃣ Incrémenter version mineure
      # ---------------------------------------
      - name: Increment minor version
        id: increment
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          MINOR=$((MINOR + 1))
          PATCH=0
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "NEW_VERSION=$NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # ---------------------------------------
      # 4️⃣ Extraire le changelog pour cette version
      # ---------------------------------------
      - name: Extract changelog for new version
        id: changelog
        run: |
          # On prend le texte entre ## [Unreleased] et la prochaine version
          CHANGELOG_TEXT=$(awk '/^## \['"$NEW_VERSION"'\]/,/^## \[.*\]/' CHANGELOG.md | sed '1d;$d')
          echo "$CHANGELOG_TEXT"
          echo "CHANGELOG_BODY<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG_TEXT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # ---------------------------------------
      # 5️⃣ Créer et pousser le tag Git
      # ---------------------------------------
      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v${{ env.NEW_VERSION }}" -m "Release v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"

      # ---------------------------------------
      # 6️⃣ Créer la GitHub Release
      # ---------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          body: ${{ env.CHANGELOG_BODY }}
