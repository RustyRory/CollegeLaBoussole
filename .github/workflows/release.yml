name: "Release Automatisation"

permissions:
  contents: write # 🔑 indispensable pour créer tags et releases

on:
  pull_request:
    types: [closed] # le workflow se déclenche quand le PR est fermé/mergé
    branches:
      - main

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev'

    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # 1️⃣ Checkout du code complet
      # ---------------------------------------
      - name: "Checkout code"
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ---------------------------------------
      # 2️⃣ Configurer Git pour actions
      # ---------------------------------------
      - name: "Configurer Git"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------
      # 3️⃣ Déterminer la nouvelle version
      # ---------------------------------------
      - name: "Déterminer la nouvelle version"
        id: semver
        run: |
          set -e

          # Dernier tag existant qui suit vX.Y.Z
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          if [[ -z "$LATEST_TAG" ]]; then
            VERSION="0.1.0"
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)

            # Incrémentation de la version mineure (x.y+1.0)
            MINOR=$((MINOR + 1))
            PATCH=0
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          TAG="v$VERSION"
          echo "Nouvelle release : $TAG"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Le tag $TAG existe déjà"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ---------------------------------------
      # 4️⃣ Vérifier le CHANGELOG
      # ---------------------------------------
      - name: "Vérifier le CHANGELOG"
        id: changelog_check
        run: |
          set -e
          VERSION="${{ steps.semver.outputs.version }}"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "❌ CHANGELOG.md est manquant"
            exit 1
          fi

          # Extraire uniquement la section correspondant à cette version
          SECTION=$(awk "
            BEGIN {found=0}
            /^## \\[$VERSION\\]/ {found=1}
            found {print}
            found && /^## \\[[0-9]/ && !/^## \\[$VERSION\\]/ {exit}
          " CHANGELOG.md)

          if [[ -z "$SECTION" ]]; then
            echo "❌ Aucune entrée de changelog pour la version $VERSION"
            exit 1
          fi

          # Vérifier qu'il y a du contenu réel
          CONTENT=$(echo "$SECTION" | grep -Ev '^(## |\s*$|### )')
          if [[ -z "$CONTENT" ]]; then
            echo "❌ Le changelog pour la version $VERSION est vide"
            exit 1
          fi

          echo "✅ Changelog valide pour la version $VERSION"

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ---------------------------------------
      # 5️⃣ Créer le tag et le pousser automatiquement
      # ---------------------------------------
      - name: "Créer le tag Git"
        run: |
          git tag "${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}"

      # ---------------------------------------
      # 6️⃣ Créer la GitHub Release
      # ---------------------------------------
      - name: "Créer la GitHub Release"
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ steps.semver.outputs.tag }}"
          name: "${{ steps.semver.outputs.tag }}"
          body: "${{ steps.changelog_check.outputs.release_notes }}"
