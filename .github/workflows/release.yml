name: 'Release workflow'

on:
  push:
    branches:
      - 'release/*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # pour récupérer tous les tags

      - name: 'Set up Git'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 'Determine release version'
        id: semver
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [[ "$BRANCH_NAME" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Release version: $VERSION"
          else
            echo "❌ Branch name does not match release/x.y.z"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 'Create git tag'
        run: |
          git tag "v${{ steps.semver.outputs.version }}"
          git push origin "v${{ steps.semver.outputs.version }}"

      - name: 'Extract changelog section'
        id: changelog
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          if [[ -f CHANGELOG.md ]]; then
            sed -n "/## \[$VERSION\]/,/^## /p" CHANGELOG.md > release_notes.txt
          else
            echo "No CHANGELOG.md found" > release_notes.txt
          fi
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 'Create GitHub Release'
        uses: ncipollo/release-action@v1
        with:
          tag: 'v${{ steps.semver.outputs.version }}'
          name: 'Release v${{ steps.semver.outputs.version }}'
          body: '${{ steps.changelog.outputs.release_notes }}'
