name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend tests
        run: |
          cd backend
          npm install
          npm test

      - name: Frontend tests
        run: |
          cd frontend
          npm install
          npm test
