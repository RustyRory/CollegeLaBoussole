name: Issue Reference Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ticket-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check issue reference
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          BRANCH="${{ github.head_ref }}"

          if [[ ! "$TITLE" =~ #[0-9]+ && ! "$BRANCH" =~ [0-9]+- ]]; then
            echo "❌ Aucune référence à une issue trouvée."
            echo "Ajoute #<numero> dans le titre ou la branche."
            exit 1
          fi

          echo "✅ Issue détectée."
